<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Will You Be My Date? ❤️</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #ffd1dc 0%, #ffb3c6 25%, #ff8fa3 50%, #ff6b8a 75%, #ff4d6d 100%);
  background-size: 400% 400%;
  animation: gradientBG 8s ease infinite;
  overflow: hidden;
  position: relative;
  padding: 16px;
}

@keyframes gradientBG {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

/* Floating hearts background */
.hearts-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.heart-bg {
  position: absolute;
  font-size: 24px;
  animation: floatHeart linear infinite;
  opacity: 0.3;
  user-select: none;
}

@keyframes floatHeart {
  0% {
    transform: translateY(100vh) rotate(0deg) scale(0.5);
    opacity: 0;
  }
  10% {
    opacity: 0.4;
  }
  90% {
    opacity: 0.4;
  }
  100% {
    transform: translateY(-10vh) rotate(720deg) scale(1.2);
    opacity: 0;
  }
}

/* Main card */
.card {
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 48px;
  padding: 48px 32px;
  max-width: 520px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(255, 77, 109, 0.3), inset 0 1px 0 rgba(255,255,255,0.4);
  border: 1px solid rgba(255,255,255,0.3);
  position: relative;
  z-index: 1;
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.card.hidden {
  opacity: 0;
  transform: scale(0.8);
  pointer-events: none;
}

.question {
  font-size: clamp(28px, 6vw, 42px);
  color: #fff;
  text-shadow: 0 2px 20px rgba(255, 77, 109, 0.4);
  margin-bottom: 40px;
  font-weight: 700;
  line-height: 1.3;
}

/* Buttons */
.buttons {
  display: flex;
  gap: 24px;
  justify-content: center;
  align-items: center;
  position: relative;
  min-height: 60px;
}

.btn {
  padding: 16px 48px;
  border: none;
  border-radius: 60px;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  letter-spacing: 0.5px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.btn-yes {
  background: linear-gradient(135deg, #ff4d6d, #ff1e4b);
  color: white;
  box-shadow: 0 8px 30px rgba(255, 77, 109, 0.5);
  min-width: 180px;
  padding: 20px 56px;
  font-size: 24px;
}

.btn-yes:hover {
  transform: scale(1.08) translateY(-2px);
  box-shadow: 0 12px 40px rgba(255, 77, 109, 0.6);
}

.btn-yes:active {
  transform: scale(0.96);
}

.btn-no {
  background: rgba(255, 255, 255, 0.3);
  color: rgba(255, 255, 255, 0.9);
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  border: 1px solid rgba(255,255,255,0.3);
  backdrop-filter: blur(10px);
  position: fixed;
  left: calc(50% + 30px);
  top: 50%;
  transition: none;
  user-select: none;
  -webkit-user-select: none;
  z-index: 999;
}

/* Tease message */
.tease-msg {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  padding: 20px 36px;
  border-radius: 24px;
  font-size: clamp(22px, 4vw, 32px);
  font-weight: 700;
  color: #ff4d6d;
  box-shadow: 0 20px 60px rgba(255, 77, 109, 0.3);
  z-index: 100;
  pointer-events: none;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
}

.tease-msg.show {
  transform: translate(-50%, -50%) scale(1);
}

/* Date selection */
.date-selection {
  display: none;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin-top: 32px;
}

.date-selection.visible {
  display: flex;
}

.date-selection h2 {
  width: 100%;
  font-size: clamp(20px, 4vw, 28px);
  color: #fff;
  margin-bottom: 12px;
  text-shadow: 0 2px 10px rgba(255, 77, 109, 0.3);
}

.date-card {
  background: rgba(255, 255, 255, 0.35);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.4);
  padding: 16px 24px;
  border-radius: 20px;
  color: #fff;
  font-size: clamp(15px, 2.5vw, 18px);
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 4px 15px rgba(255, 77, 109, 0.2);
  user-select: none;
}

.date-card:hover {
  transform: scale(1.08) translateY(-4px);
  background: rgba(255, 77, 109, 0.5);
  box-shadow: 0 12px 40px rgba(255, 77, 109, 0.4);
}

.date-card:active {
  transform: scale(0.95);
}

/* Confirmation screen */
.confirmation {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.confirmation.visible {
  display: flex;
}

.confirmation .big-icon {
  font-size: 72px;
  animation: bounceHeart 1s ease infinite;
}

@keyframes bounceHeart {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

.confirmation h2 {
  font-size: clamp(24px, 5vw, 36px);
  color: #fff;
  text-shadow: 0 2px 20px rgba(255, 77, 109, 0.4);
}

.confirmation p {
  font-size: clamp(16px, 3vw, 22px);
  color: rgba(255,255,255,0.9);
}

.confirmation .sub-text {
  font-size: clamp(14px, 2.5vw, 18px);
  color: rgba(255,255,255,0.7);
  margin-top: 8px;
}

.reset-btn {
  margin-top: 16px;
  padding: 12px 32px;
  border: none;
  border-radius: 40px;
  background: rgba(255,255,255,0.3);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.3);
  transition: all 0.3s ease;
}

.reset-btn:hover {
  background: rgba(255,255,255,0.5);
  transform: scale(1.05);
}

/* Floating hearts on confirm */
.confetti-hearts {
  position: fixed;
  pointer-events: none;
  z-index: 50;
  inset: 0;
  overflow: hidden;
}

.confetti-heart {
  position: absolute;
  font-size: 28px;
  animation: confettiFall linear forwards;
  user-select: none;
}

@keyframes confettiFall {
  0% {
    opacity: 1;
    transform: translateY(-10vh) rotate(0deg) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateY(110vh) rotate(720deg) scale(0.3);
  }
}

/* Responsive */
@media (max-width: 480px) {
  .card {
    padding: 28px 16px;
    border-radius: 28px;
  }
  .question {
    margin-bottom: 28px;
  }
  .buttons {
    gap: 12px;
    min-height: 50px;
  }
  .btn {
    padding: 12px 24px;
    font-size: 16px;
  }
  .btn-yes {
    min-width: 140px;
    padding: 16px 36px;
    font-size: 20px;
  }
  .btn-no {
    font-size: 16px;
    padding: 12px 24px;
  }
  .date-card {
    padding: 12px 16px;
    font-size: 14px;
    flex: 1 1 auto;
    min-width: calc(50% - 12px);
  }
  .confirmation .big-icon {
    font-size: 56px;
  }
}

@media (max-width: 380px) {
  .card {
    padding: 20px 12px;
    border-radius: 24px;
  }
  .question {
    font-size: 22px;
    margin-bottom: 20px;
  }
  .btn {
    font-size: 14px;
    padding: 10px 18px;
  }
  .btn-yes {
    min-width: 110px;
    padding: 14px 28px;
    font-size: 17px;
  }
  .btn-no {
    font-size: 14px;
    padding: 10px 18px;
  }
  .date-card {
    font-size: 13px;
    padding: 10px 12px;
    min-width: 100%;
  }
}
</style>
</head>
<body>

<div class="hearts-bg" id="heartsBg"></div>

<div class="card" id="mainCard">
  <div class="question" id="questionText">Te che paalam ko si bal, gala kami ❤️</div>

  <div class="buttons" id="btnContainer">
    <button class="btn btn-yes" id="btnYes">YES 💕</button>
    <button class="btn btn-no" id="btnNo">NO 😅</button>
  </div>

  <div class="date-selection" id="dateSelection">
    <h2>Saan dito te che ❤️</h2>
    <div class="date-card" data-date="Binondo Food Trip 🍜">Binondo Food Trip 🍜</div>
    <div class="date-card" data-date="Staycation Condo 🏙️">Staycation Condo 🏙️</div>
    <div class="date-card" data-date="Mall Date 🛍️">Mall Date 🛍️</div>
    <div class="date-card" data-date="Samgyupsal/Subo 🍖">Samgyupsal/Subo 🍖</div>
    <div class="date-card" data-date="Lick and Eat Food Trip 🍦🍔">Lick and Eat 🍦🍔</div>
  </div>

  <div class="confirmation" id="confirmation">
    <div class="big-icon">🥰</div>
    <h2 id="confirmTitle">Yay! It's a date! 💕</h2>
    <p id="confirmText">We're going on:</p>
    <p id="chosenDate" style="font-size: clamp(22px, 4vw, 30px); font-weight: 700; margin-top: 4px;"></p>
    <p class="sub-text">Thank you Kig-💖</p>
    <button class="reset-btn" id="resetBtn">Start Over 🔄</button>
  </div>
</div>

<div class="tease-msg" id="teaseMsg"></div>
<div class="confetti-hearts" id="confettiHearts"></div>

<audio id="bgMusic" loop preload="auto" src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACAf39/f4B/gH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af39/f4B/gH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af39/f4B/gH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af39/f4B/gH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af39/f4B/gH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af39/f4B/gH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af39/f4B/gH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af39/f4B/gH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af39/f4B/gH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af39/f4B/gH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af39/f4B/gH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af39/f4B/gH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af39/f4B/gH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af39/f4B/gH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af39/f4B/gH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af39/f4B/gH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af39/f4B/gH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgH+Af39/f4B/gH+Af4B/gH+Af3+AgH+Af4B/gH+Af3+AgA="></audio>

<script>
// === Floating hearts background ===
(function() {
  const container = document.getElementById('heartsBg');
  const emojis = ['❤️', '💕', '💖', '💗', '💘', '💝', '🌸', '✨'];
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('div');
    el.className = 'heart-bg';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (14 + Math.random() * 24) + 'px';
    el.style.animationDuration = (8 + Math.random() * 16) + 's';
    el.style.animationDelay = (Math.random() * 20) + 's';
    container.appendChild(el);
  }
})();

// === Tease messages ===
const teaseMessages = [
  'Are you sure? 🥺',
  'Please think again ❤️',
  'No is not an option 😆',
  'Try again! 💕',
  'You know you want to! 💖',
  'Don\'t be shy 🥰',
];

const btnNo = document.getElementById('btnNo');
const btnYes = document.getElementById('btnYes');
const teaseMsg = document.getElementById('teaseMsg');
const mainCard = document.getElementById('mainCard');
const dateSelection = document.getElementById('dateSelection');
const confirmation = document.getElementById('confirmation');
const questionText = document.getElementById('questionText');
const chosenDate = document.getElementById('chosenDate');
const resetBtn = document.getElementById('resetBtn');
const btnContainer = document.getElementById('btnContainer');
const bgMusic = document.getElementById('bgMusic');

let teaseIndex = 0;
let noMoveCount = 0;
let audioStarted = false;

function startAudio() {
  if (audioStarted) return;
  audioStarted = true;
  bgMusic.volume = 0.3;
  bgMusic.play().catch(() => {});
}

function showTease() {
  const msg = teaseMessages[teaseIndex % teaseMessages.length];
  teaseIndex++;
  teaseMsg.textContent = msg;
  teaseMsg.classList.add('show');
  clearTimeout(teaseMsg._hideTimer);
  teaseMsg._hideTimer = setTimeout(() => {
    teaseMsg.classList.remove('show');
  }, 1000);
}

function moveNoButton() {
  const btnW = btnNo.offsetWidth;
  const btnH = btnNo.offsetHeight;
  const cardRect = mainCard.getBoundingClientRect();
  const gap = 10;

  const minX = cardRect.left + gap;
  const maxX = cardRect.right - btnW - gap;
  const minY = cardRect.top + gap;
  const maxY = cardRect.bottom - btnH - gap;

  const nx = minX + Math.random() * Math.max(maxX - minX, 0);
  const ny = minY + Math.random() * Math.max(maxY - minY, 0);

  btnNo.style.position = 'fixed';
  btnNo.style.left = nx + 'px';
  btnNo.style.top = ny + 'px';

  noMoveCount++;
  if (noMoveCount % 3 === 0) showTease();
}

btnNo.addEventListener('mouseover', (e) => {
  e.stopPropagation();
  moveNoButton();
});

btnNo.addEventListener('touchstart', (e) => {
  e.preventDefault();
  e.stopPropagation();
  moveNoButton();
  showTease();
});

// === YES button ===
btnYes.addEventListener('click', () => {
  startAudio();
  triggerConfetti();
  mainCard.classList.add('hidden');

  setTimeout(() => {
    questionText.style.display = 'none';
    btnContainer.style.display = 'none';
    dateSelection.classList.add('visible');
    mainCard.classList.remove('hidden');
  }, 500);
});

// === Date selection ===
document.querySelectorAll('.date-card').forEach(card => {
  card.addEventListener('click', () => {
    const choice = card.getAttribute('data-date');
    chosenDate.textContent = choice;
    dateSelection.classList.remove('visible');
    confirmation.classList.add('visible');
    triggerFloatingHearts();
    startAudio();
  });
});

// === Reset ===
resetBtn.addEventListener('click', () => {
  confirmation.classList.remove('visible');
  dateSelection.classList.remove('visible');
  questionText.style.display = '';
  btnContainer.style.display = '';
  mainCard.classList.remove('hidden');
  btnNo.style.position = '';
  btnNo.style.left = '';
  btnNo.style.top = '';
  noMoveCount = 0;
  teaseIndex = 0;
});

// === Confetti ===
function triggerConfetti() {
  const container = document.getElementById('confettiHearts');
  const emojis = ['❤️', '💕', '💖', '💗', '💘', '💝', '🎉', '✨', '🥳'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-heart';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (16 + Math.random() * 28) + 'px';
    el.style.animationDuration = (2 + Math.random() * 3) + 's';
    el.style.animationDelay = Math.random() * 1.5 + 's';
    container.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }
}

let floatInterval;

function triggerFloatingHearts() {
  const container = document.getElementById('confettiHearts');
  const emojis = ['❤️', '💕', '💖', '💗', '💘', '💝'];
  if (floatInterval) clearInterval(floatInterval);
  floatInterval = setInterval(() => {
    const el = document.createElement('div');
    el.className = 'confetti-heart';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (20 + Math.random() * 30) + 'px';
    el.style.animationDuration = (3 + Math.random() * 4) + 's';
    el.style.animationDelay = '0s';
    container.appendChild(el);
    setTimeout(() => el.remove(), 7000);
  }, 400);
}
</script>
</body>
</html>
